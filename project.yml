name: Rentro
options:
  bundleIdPrefix: com.rentro
  developmentLanguage: en
  knownRegions: [en, id, Base]
  deploymentTarget: {iOS: "26.0"}
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    DEVELOPMENT_TEAM: JLQK39AS23
targets:
  Rentro:
    type: application
    platform: iOS
    sources: [Apps/Rentro, Shared]
    info:
      path: Apps/Rentro/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rentro
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {UIColorName: LaunchBackground}
        UIApplicationSceneManifest: {UIApplicationSupportsMultipleScenes: false}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Rentro shares this rental iPhone's location with the rental business you agreed to, only while the tracking agreement is active.
        NSLocationAlwaysAndWhenInUseUsageDescription: Rentro shares this rental iPhone's location with the rental business you agreed to, including while the app is in the background, only while the tracking agreement is active.
        NSCameraUsageDescription: Rentro uses the camera only to scan the pairing QR code shown by the rental business.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rentro.admin   # already linked to iCloud.com.rentro.shared
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Apps/Rentro/Resources/Rentro.entitlements
  RentroTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit, Tests/TrackerUnit]
    dependencies: [{target: Rentro}]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: com.rentro.tests}}
  RentroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests, Tests/TrackerUITests]
    dependencies: [{target: Rentro}]
    settings: {base: {GENERATE_INFOPLIST_FILE: YES, PRODUCT_BUNDLE_IDENTIFIER: com.rentro.uitests}}
schemes:
  Rentro:
    build: {targets: {Rentro: all}}
    test: {targets: [RentroTests, RentroUITests]}
